name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Validate specs and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate provider specs against the schema
        run: |
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats -s docs/providers/schema.json -d "docs/providers/!(schema).json"
      - name: Every fixture and vector parses
        run: |
          for f in $(find docs/fixtures docs/alerts/vectors -name '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        if: hashFiles('windows/Tokendial.slnx') != ''
        run: dotnet test windows/Tokendial.slnx --configuration Release
      - name: Publish
        if: hashFiles('windows/Tokendial.slnx') != ''
        run: dotnet publish windows/Tokendial.App --configuration Release -o windows/dist
      - uses: actions/upload-artifact@v4
        if: hashFiles('windows/Tokendial.slnx') != ''
        with:
          name: tokendial-windows
          path: windows/dist/

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        if: hashFiles('macos/TokendialCore/Package.swift') != ''
        run: swift test --package-path macos/TokendialCore
      # The app target carries no XCTest bundle - its tests live in the Swift package and ran in the step
      # above - so asking xcodebuild for the test action fails on a scheme that has no testable at all.
      # This step builds, and now says so in its name.
      - name: App build
        if: hashFiles('macos/project.yml') != ''
        run: |
          brew install xcodegen
          cd macos && xcodegen generate
          xcodebuild -project Tokendial.xcodeproj -scheme Tokendial -destination 'platform=macOS' \
            -configuration Debug -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= \
            build
      # A picture of the panel is a diagnostic, not a gate: it needs a window server, and on a fresh
      # machine the app can be sitting on a keychain prompt instead of drawing dials.
      - name: Smoke screenshot
        if: hashFiles('macos/project.yml') != ''
        continue-on-error: true
        run: |
          APP=$(find macos/build -name 'Tokendial.app' -path '*Debug*' | head -1)
          open "$APP" && sleep 8 && screencapture -x macos/build/smoke.png
      - uses: actions/upload-artifact@v4
        if: hashFiles('macos/project.yml') != ''
        with:
          name: tokendial-macos-smoke
          path: |
            macos/build/smoke.png
            macos/build/Build/Products/Debug/Tokendial.app

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      # The build validates the frontmatter schema. This validates the half a schema cannot see: both
      # languages present, sources filled in, no fonts the content security policy would refuse.
      - name: Articles follow the house rules
        working-directory: site
        run: npm run check-posts
      - name: Build
        working-directory: site
        run: npm run build
