name: Release

on:
  push:
    tags: ['v*']
  # Assets can be rebuilt for a tag that already exists. The tag itself never moves - a ruleset forbids
  # it - so this is for replacing an artifact that was built wrong, not for changing what was released.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to rebuild the macOS assets for, such as v0.1.0
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    # A manual run rebuilds macOS only; the Windows assets are produced by the tag push that made the
    # release, and vpk would refuse to publish over a release that already exists.
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: The tag must match VERSION
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [ "${GITHUB_REF_NAME}" = "v${VERSION}" ] || { echo "tag ${GITHUB_REF_NAME} but VERSION is ${VERSION}"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Test
        run: dotnet test windows/Tokendial.slnx --configuration Release
      - name: Publish
        run: dotnet publish windows/Tokendial.App --configuration Release -o windows/publish
      - name: Install Velopack
        run: dotnet tool install -g vpk
      - name: Fetch the previous release for deltas
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir windows/dist
        continue-on-error: true
      - name: Pack
        run: >
          vpk pack --packId Tokendial --packVersion ${{ env.VERSION }} --packDir windows/publish
          --mainExe Tokendial.exe --packTitle Tokendial --packAuthors "Raybel Hernández"
          --icon windows/Tokendial.App/Assets/tokendial.ico --aumid Tokendial.Desktop
          --shortcuts Desktop,StartMenuRoot --outputDir windows/dist
      - name: Upload to the GitHub release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir windows/dist --publish --releaseName "Tokendial ${{ env.VERSION }}" --tag ${{ github.ref_name }}

  macos:
    name: macOS package
    # On a tag push the release is created by the Windows job, so this one waits rather than racing it for
    # a release that does not exist yet. On a manual run the Windows job is skipped, which is not a failure.
    needs: windows
    if: always() && needs.windows.result != 'failure' && needs.windows.result != 'cancelled'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: The tag must match VERSION
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(tr -d '[:space:]' < VERSION)
          [ "${TAG}" = "v${VERSION}" ] || { echo "tag ${TAG} but VERSION is ${VERSION}"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: macos
        run: xcodegen generate
      - name: Test
        working-directory: macos/TokendialCore
        run: swift test
      # The repository is signed for this machine only: project.yml names a self-signed "Tokendial Dev"
      # identity that exists on no runner. Releases are therefore signed ad hoc, which is enough for the
      # binary to run once the user clears the quarantine flag, and is why the release notes have to say so.
      - name: Archive
        working-directory: macos
        run: >
          xcodebuild -project Tokendial.xcodeproj -scheme Tokendial -configuration Release
          -derivedDataPath build -archivePath build/Tokendial.xcarchive archive
          ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Export the app
        working-directory: macos
        run: |
          APP="build/Tokendial.xcarchive/Products/Applications/Tokendial.app"
          [ -d "$APP" ] || { echo "the archive carries no app"; exit 1; }
          mkdir -p dist
          cp -R "$APP" dist/
          codesign --force --deep --sign - dist/Tokendial.app
          codesign -dv dist/Tokendial.app 2>&1 | grep -q "Signature=adhoc"
      # v0.1.0 shipped arm64 only, because the runners are Apple Silicon and the archive took the active
      # architecture alone. An Intel Mac could not open it. This fails the build rather than the download.
      - name: The app must open on both Apple ecosystems
        working-directory: macos
        run: |
          BIN="dist/Tokendial.app/Contents/MacOS/Tokendial"
          ARCHS=$(lipo -archs "$BIN")
          echo "architectures: ${ARCHS}"
          for want in arm64 x86_64; do
            case " ${ARCHS} " in *" ${want} "*) ;; *) echo "missing ${want}"; exit 1;; esac
          done
      - name: Zip and disk image
        working-directory: macos/dist
        run: |
          ditto -c -k --keepParent Tokendial.app "Tokendial-${VERSION}-macos.zip"
          hdiutil create -volname "Tokendial ${VERSION}" -srcfolder Tokendial.app -ov -format UDZO "Tokendial-${VERSION}-macos.dmg"
          shasum -a 256 Tokendial-*-macos.* > "Tokendial-${VERSION}-macos.sha256"
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload ${{ env.TAG }} --clobber
          macos/dist/Tokendial-${{ env.VERSION }}-macos.zip
          macos/dist/Tokendial-${{ env.VERSION }}-macos.dmg
          macos/dist/Tokendial-${{ env.VERSION }}-macos.sha256
