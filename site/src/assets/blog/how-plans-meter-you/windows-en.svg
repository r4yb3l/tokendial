<text x="20" y="360" font-size="12.5" font-weight="600" fill="#334155">Calendar month (GitHub Copilot AI credits, Cursor, OpenCode Go monthly cap)</text>
<text x="20" y="378" font-size="11.5" fill="#475569">Refills on the first of the month at 00:00 UTC (Copilot) or on your billing date (Cursor); nothing carries over.</text>
<text x="20" y="404" font-size="11" fill="#64748b">Diagram: Tokendial, built from the vendors' own plan pages read on 8 September 2026 (see Sources). Times are an example day.</text>
