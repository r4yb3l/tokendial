<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="20" y="30" font-size="15" font-weight="600" fill="#0f172a">Un agente de código es un modelo usando herramientas en bucle, con la realidad del entorno en cada paso</text>
<rect x="20" y="150" width="120" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="80.0" y="172.66666666666666" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">Tú</text>
<text x="80.0" y="189.16666666666666" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">(petición y luego</text>
<text x="80.0" y="205.66666666666666" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">puntos de control)</text>
<rect x="210" y="70" width="170" height="62" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
<text x="295.0" y="96.91666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">El modelo decide</text>
<text x="295.0" y="113.41666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">el siguiente paso</text>
<rect x="470" y="70" width="170" height="62" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
<text x="555.0" y="96.91666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">Llama a una</text>
<text x="555.0" y="113.41666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">herramienta</text>
<rect x="470" y="240" width="170" height="62" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
<text x="555.0" y="266.9166666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">Lee el resultado</text>
<text x="555.0" y="283.4166666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">(la realidad)</text>
<rect x="210" y="240" width="170" height="62" rx="10" fill="#fce7f3" stroke="#f472b6" stroke-width="1"/>
<text x="295.0" y="266.9166666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">¿Terminó, se atascó</text>
<text x="295.0" y="283.4166666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">o sigue?</text>
<line x1="140" y1="185" x2="210" y2="108" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="175.0" y="140.5" font-size="11" text-anchor="middle" fill="#475569">tarea</text>
<line x1="380" y1="101" x2="470" y2="101" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="425.0" y="95.0" font-size="11" text-anchor="middle" fill="#475569">run_tests, edit_file…</text>
<line x1="555" y1="132" x2="555" y2="240" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="555.0" y="180.0" font-size="11" text-anchor="middle" fill="#475569">salida</text>
<line x1="470" y1="271" x2="380" y2="271" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="295" y1="240" x2="295" y2="132" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="295.0" y="180.0" font-size="11" text-anchor="middle" fill="#475569">siguiente paso</text>
<line x1="210" y1="280" x2="140" y2="200" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="175.0" y="234.0" font-size="11" text-anchor="middle" fill="#475569">respuesta o pregunta</text>
<rect x="690" y="60" width="110" height="250" rx="12" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
<text x="745" y="82" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Entorno</text>
<text x="745" y="108" font-size="11.5" text-anchor="middle" fill="#475569">tus archivos</text>
<text x="745" y="130" font-size="11.5" text-anchor="middle" fill="#475569">la terminal</text>
<text x="745" y="152" font-size="11.5" text-anchor="middle" fill="#475569">las pruebas</text>
<text x="745" y="174" font-size="11.5" text-anchor="middle" fill="#475569">git</text>
<text x="745" y="196" font-size="11.5" text-anchor="middle" fill="#475569">servidores MCP</text>
<line x1="640" y1="101" x2="690" y2="101" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="690" y1="271" x2="640" y2="271" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="20" y="374" font-size="11" fill="#64748b">Diagrama: Tokendial, a partir de "Building effective agents" de Anthropic (diciembre de 2024): los agentes son "LLM que usan herramientas</text>
<text x="20" y="389" font-size="11" fill="#64748b">según la retroalimentación del entorno, en bucle", con pausas para el humano en puntos de control y condiciones de parada.</text>
</svg>