<rect x="776.158940397351" y="60" width="23.841059602649008" height="46" fill="#10b981" stroke="#94a3b8" stroke-width="0.8"/>
<rect x="20" y="140" width="14" height="14" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
<text x="42" y="151" font-size="12" fill="#0f172a">Prompt de sistema e instrucciones</text>
<text x="42" y="166" font-size="11" fill="#64748b">Fijo por proyecto; se paga en cada turno</text>
<rect x="420" y="140" width="14" height="14" rx="3" fill="#e0e7ff" stroke="#94a3b8" stroke-width="0.8"/>
<text x="442" y="151" font-size="12" fill="#0f172a">Definiciones de herramientas (propias y MCP)</text>
<text x="442" y="166" font-size="11" fill="#64748b">Crece con cada servidor que conectas</text>
<rect x="20" y="180" width="14" height="14" rx="3" fill="#bfdbfe" stroke="#94a3b8" stroke-width="0.8"/>
<text x="42" y="191" font-size="12" fill="#0f172a">Conversación hasta ahora</text>
<text x="42" y="206" font-size="11" fill="#64748b">Todo desde que empezó la conversación</text>
<rect x="420" y="180" width="14" height="14" rx="3" fill="#fef3c7" stroke="#94a3b8" stroke-width="0.8"/>
<text x="442" y="191" font-size="12" fill="#0f172a">Archivos que el agente leyó</text>
<text x="442" y="206" font-size="11" fill="#64748b">Cada lectura se queda en la ventana</text>
<rect x="20" y="220" width="14" height="14" rx="3" fill="#fed7aa" stroke="#94a3b8" stroke-width="0.8"/>
<text x="42" y="231" font-size="12" fill="#0f172a">Salida de comandos y pruebas</text>
<text x="42" y="246" font-size="11" fill="#64748b">Los logs largos son la sorpresa habitual</text>
<rect x="420" y="220" width="14" height="14" rx="3" fill="#3b82f6" stroke="#94a3b8" stroke-width="0.8"/>
<text x="442" y="231" font-size="12" fill="#0f172a">Tu mensaje nuevo</text>
<text x="442" y="246" font-size="11" fill="#64748b">Lo único que controlas directamente</text>
<rect x="20" y="260" width="14" height="14" rx="3" fill="#10b981" stroke="#94a3b8" stroke-width="0.8"/>
<text x="42" y="271" font-size="12" fill="#0f172a">La respuesta y sus ediciones</text>
<text x="42" y="286" font-size="11" fill="#64748b">Se cobra como salida, la clase cara</text>
<text x="800" y="124" font-size="12" text-anchor="end" fill="#334155">Enviado en este turno: 39,260 tokens; tú escribiste 60</text>
<text x="20" y="304" font-size="11" fill="#64748b">Diagrama: Tokendial, a partir de la documentación de Anthropic sobre la ventana de contexto: el prompt de sistema, las definiciones de herramientas,</text>
<text x="20" y="319" font-size="11" fill="#64748b">cada mensaje anterior, los resultados de herramientas y la respuesta cuentan. Los tamaños son plausibles para una sesión media de Claude Code y varían mucho.</text>
