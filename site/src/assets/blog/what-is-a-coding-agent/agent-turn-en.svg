<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<text x="20" y="30" font-size="15" font-weight="600" fill="#0f172a">Where the tokens go in one agent turn (an illustration, not a measurement)</text>
<rect x="20" y="60" width="79.47019867549669" height="46" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
<text x="59.735099337748345" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">4,000</text>
<rect x="99.47019867549669" y="60" width="119.20529801324504" height="46" fill="#e0e7ff" stroke="#94a3b8" stroke-width="0.8"/>
<text x="159.0728476821192" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">6,000</text>
<rect x="218.67549668874173" y="60" width="278.1456953642384" height="46" fill="#bfdbfe" stroke="#94a3b8" stroke-width="0.8"/>
<text x="357.74834437086093" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">14,000</text>
<rect x="496.8211920529801" y="60" width="178.80794701986756" height="46" fill="#fef3c7" stroke="#94a3b8" stroke-width="0.8"/>
<text x="586.2251655629138" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">9,000</text>
<rect x="675.6291390728477" y="60" width="99.33774834437087" height="46" fill="#fed7aa" stroke="#94a3b8" stroke-width="0.8"/>
<text x="725.2980132450331" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">5,000</text>
<rect x="774.9668874172186" y="60" width="1.1920529801324504" height="46" fill="#3b82f6" stroke="#94a3b8" stroke-width="0.8"/>
<rect x="776.158940397351" y="60" width="23.841059602649008" height="46" fill="#10b981" stroke="#94a3b8" stroke-width="0.8"/>
<rect x="20" y="140" width="14" height="14" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
<text x="42" y="151" font-size="12" fill="#0f172a">System prompt and instructions</text>
<text x="42" y="166" font-size="11" fill="#64748b">Fixed per project; paid every turn</text>
<rect x="420" y="140" width="14" height="14" rx="3" fill="#e0e7ff" stroke="#94a3b8" stroke-width="0.8"/>
<text x="442" y="151" font-size="12" fill="#0f172a">Tool definitions (built-in and MCP)</text>
<text x="442" y="166" font-size="11" fill="#64748b">Grows with every server you connect</text>
<rect x="20" y="180" width="14" height="14" rx="3" fill="#bfdbfe" stroke="#94a3b8" stroke-width="0.8"/>
<text x="42" y="191" font-size="12" fill="#0f172a">Conversation so far</text>
<text x="42" y="206" font-size="11" fill="#64748b">Everything since the conversation began</text>
<rect x="420" y="180" width="14" height="14" rx="3" fill="#fef3c7" stroke="#94a3b8" stroke-width="0.8"/>
<text x="442" y="191" font-size="12" fill="#0f172a">Files the agent read</text>
<text x="442" y="206" font-size="11" fill="#64748b">Each read stays in the window</text>
<rect x="20" y="220" width="14" height="14" rx="3" fill="#fed7aa" stroke="#94a3b8" stroke-width="0.8"/>
<text x="42" y="231" font-size="12" fill="#0f172a">Command and test output</text>
<text x="42" y="246" font-size="11" fill="#64748b">Long logs are the usual surprise</text>
<rect x="420" y="220" width="14" height="14" rx="3" fill="#3b82f6" stroke="#94a3b8" stroke-width="0.8"/>
<text x="442" y="231" font-size="12" fill="#0f172a">Your new message</text>
<text x="442" y="246" font-size="11" fill="#64748b">The only part you control directly</text>
<rect x="20" y="260" width="14" height="14" rx="3" fill="#10b981" stroke="#94a3b8" stroke-width="0.8"/>
<text x="42" y="271" font-size="12" fill="#0f172a">The answer and its edits</text>
<text x="42" y="286" font-size="11" fill="#64748b">Billed as output, the expensive kind</text>
<text x="800" y="124" font-size="12" text-anchor="end" fill="#334155">Sent this turn: 39,260 tokens; you typed 60 of them</text>
<text x="20" y="304" font-size="11" fill="#64748b">Diagram: Tokendial, built from Anthropic's context window documentation: the system prompt, tool definitions, every earlier message,</text>
<text x="20" y="319" font-size="11" fill="#64748b">tool results and the answer all count. Sizes are plausible for a mid-length Claude Code session and vary widely.</text>
</svg>