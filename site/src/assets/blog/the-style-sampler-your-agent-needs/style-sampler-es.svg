<text x="38" y="338" font-size="12" font-weight="600" fill="#0f172a">Qué te entrega Get Prompt</text>
<text x="38" y="360" font-size="11.5" fill="#475569">1. Quién es el modelo, y la orden de leer tu stack antes de nada</text>
<text x="38" y="379" font-size="11.5" fill="#475569">2. La especificación: hex exactos, escala, bordes, texturas, cada estado</text>
<rect x="30" y="389" width="760" height="24" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
<text x="38" y="405" font-size="11.5" font-weight="500" fill="#065f46">3. Lo que el estilo NO es: sin degradados, sin sombras, sin esquinas redondeadas</text>
<text x="38" y="433" font-size="11" fill="#94a3b8">Una prohibición aterriza donde un adjetivo no</text>
