<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="20" y="30" font-size="15" font-weight="600" fill="#0f172a">One design round trip through an MCP design server</text>
<rect x="0" y="50" width="120" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="60.0" y="76.16666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">You</text>
<line x1="60" y1="94" x2="60" y2="420" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="210" y="50" width="120" height="44" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
<text x="270.0" y="67.91666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">Coding agent</text>
<text x="270.0" y="84.41666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">(Claude Code)</text>
<line x1="270" y1="94" x2="270" y2="420" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="420" y="50" width="120" height="44" rx="10" fill="#dcfce7" stroke="#4ade80"/>
<text x="480.0" y="67.91666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">Design MCP server</text>
<text x="480.0" y="84.41666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">(Pencil, Figma)</text>
<line x1="480" y1="94" x2="480" y2="420" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<rect x="630" y="50" width="120" height="44" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
<text x="690.0" y="76.16666666666667" font-size="12.5" font-weight="500" text-anchor="middle" fill="#0f172a">Design canvas</text>
<line x1="690" y1="94" x2="690" y2="420" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<line x1="60" y1="120" x2="270" y2="120" stroke="#475569" stroke-width="1.3" marker-end="url(#a)"/>
<text x="165.0" y="114" font-size="11.5" text-anchor="middle" fill="#334155">“Sketch the settings screen: two columns, dark”</text>
<line x1="270" y1="150" x2="480" y2="150" stroke="#475569" stroke-width="1.3" marker-end="url(#a)"/>
<text x="375.0" y="144" font-size="11.5" text-anchor="middle" fill="#334155">get_guidelines · get_app_state</text>
<line x1="480" y1="180" x2="270" y2="180" stroke="#475569" stroke-width="1.3" marker-end="url(#a)"/>
<text x="375.0" y="174" font-size="11.5" text-anchor="middle" fill="#334155">design rules + current document (text)</text>
<line x1="270" y1="210" x2="480" y2="210" stroke="#475569" stroke-width="1.3" marker-end="url(#a)"/>
<text x="375.0" y="204" font-size="11.5" text-anchor="middle" fill="#334155">execute: create frames, text, buttons</text>
<line x1="480" y1="240" x2="690" y2="240" stroke="#475569" stroke-width="1.3" marker-end="url(#a)"/>
<text x="585.0" y="234" font-size="11.5" text-anchor="middle" fill="#334155">draws on the canvas</text>
<line x1="270" y1="270" x2="480" y2="270" stroke="#475569" stroke-width="1.3" marker-end="url(#a)"/>
<text x="375.0" y="264" font-size="11.5" text-anchor="middle" fill="#334155">get_screenshot</text>
<line x1="480" y1="300" x2="270" y2="300" stroke="#475569" stroke-width="1.3" marker-end="url(#a)"/>
<text x="375.0" y="294" font-size="11.5" text-anchor="middle" fill="#334155">PNG of the frame (image tokens)</text>
<line x1="270" y1="330" x2="60" y2="330" stroke="#475569" stroke-width="1.3" marker-end="url(#a)"/>
<text x="165.0" y="324" font-size="11.5" text-anchor="middle" fill="#334155">“Here is the first pass; the sidebar is 280 px”</text>
<line x1="60" y1="360" x2="270" y2="360" stroke="#475569" stroke-width="1.3" marker-end="url(#a)"/>
<text x="165.0" y="354" font-size="11.5" text-anchor="middle" fill="#334155">“Tighter spacing, brand green on the primary button”</text>
<text x="20" y="444" font-size="11" fill="#64748b">Diagram: Tokendial, built from the tool lists the Pencil MCP server (1.0) reports over tools/list and Figma's MCP server guide.</text>
<text x="20" y="459" font-size="11" fill="#64748b">Every step on the agent's side is a model call carrying the whole conversation; the screenshot enters the window as image tokens.</text>
</svg>